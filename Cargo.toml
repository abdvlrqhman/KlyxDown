[workspace]
resolver = "3"
members = ["src-tauri", "crates/engine", "crates/bridge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/abdvlrqhman/KlyxDown"
homepage = "https://spacie.net/klyxdown"

[workspace.dependencies]
klyxdown-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
