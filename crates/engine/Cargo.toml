[package]
name = "klyxdown-engine"
description = "Download engine for KlyxDown: probing, segmented HTTP downloads, queueing, speed modes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
# Already in the tree through reqwest.
bytes = "1"
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "socks"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Already in the tree through Tauri's image decoders: unpacks one file from a remote ZIP.
flate2 = "1"
# Already in the tree: stores .torrent bytes inside the download's JSON details.
base64 = "0.22"
# Already in the tree: client nonces for Digest sign-ins.
getrandom = "0.3"
md-5 = "0.10"
# BitTorrent: magnets, DHT, piece-prioritized streaming. rustls like the rest of the engine.
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
percent-encoding = "2"
quick-xml = "0.38"
rusqlite = { version = "0.41", features = ["bundled"] }
sha1 = "0.10"
# Implicit FTPS (port 990) sits behind "deprecated".
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
# Already in the tree through reqwest: checks FTPS certificates against the system store.
rustls-platform-verifier = "0.7"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Already in the tree through Tauri: Attachment Services runs the installed antivirus.
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree: sets the quarantine flag Gatekeeper checks on first open.
libc = "0.2"

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"
tokio = { workspace = true, features = ["net"] }
