[package]
name = "klyxdown"
description = "KlyxDown, an open-source download manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "klyxdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
klyxdown-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-deep-link = "2.6.3"
# Magnet links reach a running KlyxDown through single-instance's arguments on Windows and
# Linux, and through deep-link's open-URL events on macOS.
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Already in the tree (through the engine and Tauri): the preview player's local feed.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# Site passwords live in the OS keychain (Windows Credential Manager, macOS Keychain,
# Secret Service on Linux), never in settings or the download database.
keyring = "4.2"

[target.'cfg(windows)'.dependencies]
# Already in the tree through the autostart plugin.
windows-registry = "0.6"
# Already in the tree through Tauri; only the metered-connection check is added.
windows = { version = "0.62", features = ["Networking_Connectivity"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree through Tauri; for the Network.framework path monitor callback.
block2 = "0.6"
