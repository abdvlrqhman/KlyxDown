[package]
name = "klyxdown"
description = "KlyxDown, an open-source download manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "klyxdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
klyxdown-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2.5.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Already in the tree through Tauri.
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
# Already in the tree through the autostart plugin.
windows-registry = "0.6"
