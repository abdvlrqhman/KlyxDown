<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c1320">
<title>KlyxDown</title>
<style>
  :root { color-scheme: dark; --bg: #0c1320; --panel: #121b2b; --key: #1a2538; --recess: #08101b; --ink: #e4eaf3; --ink2: #8f9db3; --accent: #8dbaf2; --warn: #f2a28e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: max(14px, env(safe-area-inset-top)) 14px 24px; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 19px; }
  #total { color: var(--ink2); font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 8px; margin-bottom: 14px; }
  input { flex: 1; min-width: 0; padding: 12px; border: 0; border-radius: 10px; background: var(--recess); color: var(--ink); font: inherit; }
  button { padding: 10px 14px; border: 0; border-radius: 10px; background: var(--key); color: var(--ink); font: 600 14px system-ui, sans-serif; }
  button.go { background: var(--accent); color: #0a1424; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { padding: 12px; border-radius: 12px; background: var(--panel); display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { grid-column: 1; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--recess); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  li[data-state=failed] .meta { color: var(--warn); }
  li button { grid-row: 1 / 3; grid-column: 2; }
  #note { color: var(--ink2); font-size: 13px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<header><h1>KlyxDown</h1><span id="total"></span></header>
<form id="add"><input id="link" type="url" placeholder="Paste a link or magnet" autocomplete="off" aria-label="Link"><button class="go">Add</button></form>
<ul id="list"></ul>
<p id="note"></p>
<script>
  // The token from the QR code; also sent with every request, and kept out of the address bar.
  const token = new URLSearchParams(location.search).get('t') || sessionStorage.getItem('t') || '';
  sessionStorage.setItem('t', token);
  history.replaceState(null, '', location.pathname);
  const api = (path, init = {}) => fetch(path, { ...init, headers: { 'x-klyxdown-token': token, 'content-type': 'application/json' } });
  const mb = (b) => (b / 1e6).toFixed(b >= 1e9 ? 0 : 1);
  const size = (b) => (b == null ? '?' : b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : mb(b) + ' MB');
  const words = { queued: 'Waiting', downloading: 'Downloading', paused: 'Paused', waitingForNetwork: 'Waiting for the network', failed: 'Failed', done: 'Done' };

  async function refresh() {
    let rows;
    try {
      const r = await api('/api/list');
      if (!r.ok) throw new Error(r.status === 429 ? 'Too many wrong links. Wait a few minutes.' : 'Open the link from KlyxDown again.');
      rows = await r.json();
    } catch (e) {
      document.getElementById('note').textContent = e.message || 'KlyxDown is not reachable.';
      return;
    }
    document.getElementById('note').textContent = rows.length ? '' : 'Nothing here yet.';
    const total = rows.reduce((n, d) => n + d.speed, 0);
    document.getElementById('total').textContent = total ? mb(total) + ' MB/s' : '';
    const list = document.getElementById('list');
    list.replaceChildren(...rows.slice(0, 60).map((d) => {
      const li = document.createElement('li');
      li.dataset.state = d.state;
      const name = Object.assign(document.createElement('div'), { className: 'name', textContent: d.name });
      const pct = d.size ? Math.min(100, (d.bytes / d.size) * 100) : 0;
      const meta = Object.assign(document.createElement('div'), {
        className: 'meta',
        textContent: `${words[d.state] || d.state} · ${size(d.bytes)} of ${size(d.size)}${d.speed ? ' · ' + mb(d.speed) + ' MB/s' : ''}`,
      });
      const bar = Object.assign(document.createElement('div'), { className: 'bar' });
      bar.append(Object.assign(document.createElement('i'), { style: `width:${pct.toFixed(1)}%` }));
      li.append(name, meta, bar);
      const running = d.state === 'downloading' || d.state === 'queued' || d.state === 'waitingForNetwork';
      if (d.state !== 'done') {
        const b = Object.assign(document.createElement('button'), { type: 'button', textContent: running ? 'Pause' : 'Resume' });
        b.onclick = () => api(`/api/${d.id}/${running ? 'pause' : 'resume'}`, { method: 'POST' }).then(refresh);
        li.append(b);
      }
      return li;
    }));
  }

  document.getElementById('add').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('link');
    const url = input.value.trim();
    if (!url) return;
    const r = await api('/api/add', { method: 'POST', body: JSON.stringify({ url }) });
    document.getElementById('note').textContent = r.ok ? 'Added.' : await r.text();
    if (r.ok) input.value = '';
    refresh();
  });
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
